name: Desktop release
on:
  pull_request:
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'scripts/**'
      - 'package*.json'
      - 'vite.config.js'
      - '.github/workflows/desktop-release.yml'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this new tag (e.g. v1.14.0) at the dispatched main commit; leave empty to only build'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win
            arch: x64
            executable: release/win-unpacked/心流小屋.exe
          - runner: macos-15
            platform: mac
            arch: arm64
            executable: release/mac-arm64/心流小屋.app/Contents/MacOS/心流小屋
          - runner: macos-15-intel
            platform: mac
            arch: x64
            executable: release/mac/心流小屋.app/Contents/MacOS/心流小屋
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix desktop ci --no-audit --no-fund
      - run: npm --prefix desktop run build:native
        env:
          REQUIRE_NOWPLAYING: '1'
      - run: npm --prefix desktop run build:music
      - run: npm --prefix desktop run build:web
      - run: npm run desktop:test
      - name: Package Windows
        if: matrix.platform == 'win'
        working-directory: desktop
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Package macOS
        if: matrix.platform == 'mac'
        working-directory: desktop
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Verify packaged local client
        run: npm --prefix desktop run test:client
        env:
          ALBUM_QA_SKIP_WALLPAPER: '1'
          ALBUM_QA_EXE: ${{ matrix.executable }}
      # Update info for electron-updater: latest.yml (NSIS) / latest-mac.yml (zip),
      # plus blockmaps for delta downloads. Each mac job writes its own
      # latest-mac.yml; rename it so the publish job can merge both.
      - name: Check update info
        shell: bash
        working-directory: desktop/release
        run: |
          if [ "${{ matrix.platform }}" = win ]; then test -f latest.yml && ls *-setup.exe.blockmap; else test -f latest-mac.yml && ls *.zip.blockmap && mv latest-mac.yml "latest-mac-${{ matrix.arch }}.yml"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/test-results/client/
  publish:
    needs: build
    # A pushed v* tag publishes. So does a manual run on main given release_tag:
    # gh release create then makes the tag at the tested commit.
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          merge-multiple: true
          path: release
      - name: Publish tested desktop builds
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"; target=(--verify-tag)
          else
            tag="$DISPATCH_TAG"; target=(--target "$GITHUB_SHA")
            version="v$(node -p "require('./desktop/package.json').version")"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release_tag must look like v1.2.3"; exit 1; }
            [ "$tag" = "$version" ] || { echo "release_tag $tag does not match desktop/package.json $version"; exit 1; }
          fi
          node scripts/merge-mac-update-info.mjs release/latest-mac.yml release/latest-mac-arm64.yml release/latest-mac-x64.yml
          rm release/latest-mac-arm64.yml release/latest-mac-x64.yml
          # Never publish without the files the in-app updater reads.
          for f in latest.yml latest-mac.yml; do test -s "release/$f" || { echo "missing $f"; exit 1; }; done
          ls release/*-setup.exe.blockmap release/*-mac-arm64.zip.blockmap release/*-mac-x64.zip.blockmap
          cd release
          sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt
          cd ..
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --title "心流小屋 Flow Cabin $tag · macOS & Windows" --notes-file desktop/RELEASE-NOTES.md "${target[@]}"
