name: Checks

# What this workflow proves, in order:
#   1. 依赖装得上            npm ci（根项目 + desktop/）
#   2. 单元测试全绿          npm test（桌面端 node:test + 根项目 node:test，含 CSS 设计系统守卫）
#   3. 生产构建能出包        npm run build（index / promo / wallpaper / pet / mini 五个入口）
#   4. 隔离浏览器回归不回归   npm run test:*（固定演示数据 + 生成 WAV，不联网、不碰真实账号）
# 这一串就是 CONTRIBUTING 里写的 `npm run check` + 浏览器回归；
# 没有覆盖到的部分写在 docs/limitations.md，不要把绿灯当成真机验收。
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests, production build and browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install root and desktop dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix desktop ci --no-audit --no-fund
      - name: Build desktop music adapter
        run: npm --prefix desktop run build:music
      - name: Run unit tests and production build (npm run check)
        run: npm run check
      - name: Install Chromium
        working-directory: desktop
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:browser
      - name: Run promotional page interaction tests
        run: npm run test:promo
      - name: Run silent playback regressions
        run: npm run test:playback
      - name: Verify actual playback history
        run: node --test src/player/playback-log.test.mjs
        env:
          PLAYBACK_LOG_BROWSER: '1'
      - name: Run focus and mode regressions
        run: npm run test:focus-ui
      - name: Run cat beat-sync regressions (click tracks, tone, seek, skip)
        run: npm run test:beat
      - name: Run shelf and window-control regressions
        run: npm run test:shelf-ui
      - name: Run AI settings and letter regressions
        run: npm run test:ai
      - name: Run journal entry and recovery regressions
        run: npm run test:journal
      - name: Run permanent deletion and backup recovery regressions
        run: npm run test:memory
      - name: Run wordbook provenance and flip clock regressions
        run: npm run test:study-ui
      - name: Run room theme interaction regressions
        run: npm run test:theme
      - name: Run earned souvenir persistence and recovery regressions
        run: npm run test:souvenirs
      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: |
            desktop/test-results/browser/
            desktop/test-results/promo/
            desktop/test-results/playback/
            desktop/test-results/focus-ui/
            desktop/test-results/shelf-ui/
            desktop/test-results/beat-sync/
            desktop/test-results/ai-beta/
            desktop/test-results/journal-entries/
            desktop/test-results/memory-deletion/
            desktop/test-results/study-ui/
            desktop/test-results/theme-interactions/
            desktop/test-results/souvenirs/
          if-no-files-found: warn
          retention-days: 14
