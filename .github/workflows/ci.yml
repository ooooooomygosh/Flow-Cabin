name: Checks

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, production build, and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix desktop ci --no-audit --no-fund
      - name: Build desktop music adapter
        run: npm --prefix desktop run build:music
      - name: Run unit tests and production build
        run: npm run check
      - name: Install Chromium
        working-directory: desktop
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:browser
      - name: Run silent playback regressions
        run: npm run test:playback
      - name: Verify actual playback history
        run: node --test src/player/playback-log.test.mjs
        env:
          PLAYBACK_LOG_BROWSER: '1'
      - name: Run focus and mode regressions
        run: npm run test:focus-ui
      - name: Run cat beat-sync regressions (click tracks, tone, seek, skip)
        run: npm run test:beat
      - name: Run shelf and window-control regressions
        run: npm run test:shelf-ui
      - name: Run AI settings and letter regressions
        run: npm run test:ai
      - name: Run journal entry and recovery regressions
        run: npm run test:journal
      - name: Run wordbook provenance and flip clock regressions
        run: npm run test:study-ui
      - name: Run earned souvenir persistence and recovery regressions
        run: npm run test:souvenirs
      - name: Save browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: |
            desktop/test-results/browser/
            desktop/test-results/playback/
            desktop/test-results/focus-ui/
            desktop/test-results/shelf-ui/
            desktop/test-results/beat-sync/
            desktop/test-results/ai-beta/
            desktop/test-results/journal-entries/
            desktop/test-results/study-ui/
            desktop/test-results/souvenirs/
          if-no-files-found: warn
          retention-days: 14
