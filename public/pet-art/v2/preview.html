<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flow Cabin · 桌宠美术资产</title><style>
*{box-sizing:border-box}body{margin:0;background:#1c120b;color:#ffe9cb;font:14px/1.6 system-ui,sans-serif}main{max-width:1360px;margin:auto;padding:32px 24px}h1{font-size:28px;margin:0}p{color:#c9a47a;max-width:780px}h2{margin-top:32px;font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}.cell{margin:0;padding:16px 8px 8px;background:#2e1d12;border:1px solid #59402b;display:grid;justify-items:center;gap:8px}.crop{width:104px;height:104px;position:relative}.crop>div{position:absolute;overflow:hidden}.crop img{position:absolute;max-width:none;image-rendering:pixelated}figcaption{color:#c9a47a;font:12px monospace}.tag{font:12px monospace;color:#b4bfa0;letter-spacing:1px}button{background:#3a2416;color:inherit;border:1px solid #b68d54;padding:8px 16px;cursor:pointer}body.light .cell{background:#e7d3b5}footer{margin:32px 0;color:#c9a47a;font-size:12px}
</style><main><span class="tag">FLOW CABIN / ART LIBRARY</span><h1>五位室友，与它们的小物件</h1><p>统一色板、独立透明图层与逐对象裁切数据。每只宠物包含 8 个静态姿势和 8 件配饰；这些素材尚不是完成的动画循环。</p><button id="bg">切换浅色检查底</button><div id="packs"></div><footer>请使用 manifest 中的 frame 矩形；图集不是机械等分网格。配饰叠加前仍需校准各姿势的锚点。</footer></main><script type="module">
const catalog=await fetch('./catalog.json').then(r=>r.json());const root=document.querySelector('#packs');document.querySelector('#bg').onclick=()=>document.body.classList.toggle('light');for(const pack of catalog.packs){const m=await fetch('./'+pack.manifest).then(r=>r.json()),section=document.createElement('section'),h=document.createElement('h2'),grid=document.createElement('div');h.textContent=pack.name;grid.className='grid';section.append(h,grid);root.append(section);for(const [name,{frame:f}]of Object.entries(m.frames)){const fig=document.createElement('figure'),crop=document.createElement('div'),clip=document.createElement('div'),img=new Image(),caption=document.createElement('figcaption'),s=Math.min(104/f.w,104/f.h);fig.className='cell';crop.className='crop';clip.style.cssText=`left:${(104-f.w*s)/2}px;top:${104-f.h*s}px;width:${f.w*s}px;height:${f.h*s}px`;img.src='./'+pack.atlas;img.alt=name;img.style.cssText=`width:${m.width*s}px;height:${m.height*s}px;left:${-f.x*s}px;top:${-f.y*s}px`;caption.textContent=name;clip.append(img);crop.append(clip);fig.append(crop,caption);grid.append(fig)}}
</script></html>
